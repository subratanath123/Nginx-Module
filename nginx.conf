# Global Directives (e.g., user, worker_processes)

user  nginx;
worker_processes  auto; 

events {
    worker_connections  1024; 
}

http {
	
	server {
	    listen 443 ssl;
	    listen [::]:443 ssl;

	    server_name api.jadeordersmedia.com;
	    
	    http2 on;

	    root /var/www/html;
	    index index.html index.htm;

	    # SSL certificates
	    ssl_certificate /etc/letsencrypt/live/api.jadeordersmedia.com/fullchain.pem;
	    ssl_certificate_key /etc/letsencrypt/live/api.jadeordersmedia.com/privkey.pem;

	    include /etc/letsencrypt/options-ssl-nginx.conf;
	    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
	    
	    add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, HEAD';
            add_header 'Access-Control-Allow-Headers' 'DNT,X-CustomHeader,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type';

	    location / {
		proxy_pass http://127.0.0.1:5678;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	    }
	}
}
