# Global Directives (e.g., user, worker_processes)

http {
	
	server {
	    listen 443 ssl http2;
	    listen [::]:443 ssl http2;

	    server_name api.jadeordersmedia.com;

	    root /var/www/html;
	    index index.html index.htm;

	    # SSL certificates
	    ssl_certificate /etc/letsencrypt/live/api.jadeordersmedia.com/fullchain.pem;
	    ssl_certificate_key /etc/letsencrypt/live/api.jadeordersmedia.com/privkey.pem;

	    # Use Certbot SSL options (do NOT duplicate)
	    include /etc/letsencrypt/options-ssl-nginx.conf;
	    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	    # Proxy requests
	    location / {
		proxy_pass http://172.17.0.1:5678;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		proxy_buffering off;
		proxy_request_buffering off;
	    }
	}
}
